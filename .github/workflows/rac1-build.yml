name: Build RAC1 NG++

on:
  push:
    branches: [ng-plus-plus-rac1]
    paths:
      - "ng-plus-plus-rac1/**"
      - ".github/workflows/rac1-build.yml"
  pull_request:
    branches: [ng-plus-plus-rac1]
    paths:
      - "ng-plus-plus-rac1/**"
      - ".github/workflows/rac1-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ng-plus-plus-rac1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Fetch OpenRAC SDK
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test progression
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: python ".sdk/openrac-mod-sdk-1.36.0/tools/package_mod.py" build/package/* -o dist
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python ".sdk/openrac-mod-sdk-1.36.0/tools/package_mod.py" build/package/* -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ng-plus-plus-rac1-${{ matrix.platform }}
          path: ng-plus-plus-rac1/dist/*.zip
          if-no-files-found: error
