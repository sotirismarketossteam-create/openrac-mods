name: Build RAC1 NG++

on:
  push:
    branches: [ng-plus-plus-rac1]
    paths:
      - "ng-plus-plus-rac1/**"
      - ".github/workflows/rac1-build.yml"
  pull_request:
    branches: [ng-plus-plus-rac1]
    paths:
      - "ng-plus-plus-rac1/**"
      - ".github/workflows/rac1-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ng-plus-plus-rac1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ninja
        run: python -m pip install ninja
      - name: Fetch OpenRAC SDK
        run: echo "SDK=$(python tools/fetch_sdk.py)" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test progression
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for dir in build/package/*; do
            [ -d "$dir" ] || continue
            python ".sdk/openrac-mod-sdk-1.36.0/tools/package_mod.py" "$dir" -o dist
          done
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bundle the MinGW runtime DLLs beside the plugin. OpenRAC loads
          # the plugin with LoadLibrary, which must also resolve these imports.
          $compilerLine = cmake -LA -N build | Select-String '^CMAKE_CXX_COMPILER:FILEPATH='
          if (-not $compilerLine) { throw 'Could not locate the configured C++ compiler' }
          $compiler = $compilerLine.ToString().Split('=', 2)[1]
          $runtimeDir = Split-Path $compiler
          $plugin = Get-ChildItem build/package -Recurse -Filter ng_plus_plus_rac1.dll | Select-Object -First 1
          if (-not $plugin) { throw 'Built RAC1 plugin DLL was not found' }
          foreach ($name in @('libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll')) {
            $runtime = Join-Path $runtimeDir $name
            if (-not (Test-Path $runtime)) {
              $runtime = (& $compiler "-print-file-name=$name").Trim()
            }
            if (Test-Path $runtime) {
              Copy-Item $runtime -Destination $plugin.DirectoryName -Force
            } else {
              Write-Host "Runtime dependency not present in toolchain: $name"
            }
          }
          Get-ChildItem build/package -Directory | ForEach-Object {
            python ".sdk/openrac-mod-sdk-1.36.0/tools/package_mod.py" $_.FullName -o dist
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ng-plus-plus-rac1-${{ matrix.platform }}
          path: ng-plus-plus-rac1/dist/*.zip
          if-no-files-found: error
